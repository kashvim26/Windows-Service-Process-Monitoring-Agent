services:
  - type: web
    name: sentinel-windows-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: sentinel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/monitor.db
      - key: ALERT_RETENTION_DAYS
        value: "30"
